name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint · Format · Types · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Docker image's minor (Dockerfile, BUN_IMAGE).
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Type check
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # The only checks against the built server: headers, CSP hashes, the cache,
      # the registration without JavaScript, health.
      - name: Production pages
        run: bun --no-env-file scripts/check-public-pages.ts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Every page in Chromium, light and dark: no console or CSP errors, axe without
      # serious or critical findings, menu, mode, calendar and all forms work.
      - name: Browser
        run: bun --no-env-file scripts/check-browser.ts

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-shots
          path: dist/browser-shots/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (advisory)
    runs-on: ubuntu-latest
    needs: build
    # A budget to watch, not a gate: a slow CI machine must not block a merge.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lighthouse CI
        run: bunx @lhci/cli@0.15.1 autorun
