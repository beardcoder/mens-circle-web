{{ define "import-status" }}
{{ template "header" . }}
<p style="margin:0 0 14px;font-family:'Barlow Condensed','Arial Narrow',Arial,Helvetica,sans-serif;font-size:12px;font-weight:600;line-height:1.2;letter-spacing:0.14em;text-transform:uppercase;color:#645a50;">Benachrichtigung</p>
<h1 class="em-display" style="margin:0 0 24px;font-family:'Barlow Condensed','Arial Narrow',Arial,Helvetica,sans-serif;font-size:44px;font-weight:800;line-height:0.94;letter-spacing:-0.01em;text-transform:uppercase;color:#1c1714;">Import<br>abgeschlossen.</h1>
<p style="margin:0 0 24px;font-family:'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.7;color:#4a4139;">Der Import in listmonk wurde verarbeitet.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 30px;">
  <tr>
    <td class="em-label" width="132" style="padding:10px 10px 10px 0;border-top:1px solid #d8cfbe;vertical-align:top;font-family:'Barlow Condensed','Arial Narrow',Arial,Helvetica,sans-serif;font-size:12px;font-weight:600;line-height:1.5;letter-spacing:0.12em;text-transform:uppercase;color:#645a50;">Datei</td>
    <td class="em-value" style="padding:10px 0;border-top:1px solid #d8cfbe;font-family:'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#1c1714;"><a class="em-link" href="{{ RootURL }}/admin/subscribers/import" target="_blank">{{ .Name }}</a></td>
  </tr>
  <tr>
    <td class="em-label" width="132" style="padding:10px 10px 10px 0;border-top:1px solid #d8cfbe;vertical-align:top;font-family:'Barlow Condensed','Arial Narrow',Arial,Helvetica,sans-serif;font-size:12px;font-weight:600;line-height:1.5;letter-spacing:0.12em;text-transform:uppercase;color:#645a50;">Status</td>
    <td class="em-value" style="padding:10px 0;border-top:1px solid #d8cfbe;font-family:'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#1c1714;">{{ .Status }}</td>
  </tr>
  <tr>
    <td class="em-label" width="132" style="padding:10px 10px 10px 0;border-top:1px solid #d8cfbe;vertical-align:top;font-family:'Barlow Condensed','Arial Narrow',Arial,Helvetica,sans-serif;font-size:12px;font-weight:600;line-height:1.5;letter-spacing:0.12em;text-transform:uppercase;color:#645a50;">Datensätze</td>
    <td class="em-value" style="padding:10px 0;border-top:1px solid #d8cfbe;font-family:'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#1c1714;">{{ .Imported }} / {{ .Total }}</td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 8px;">
  <tr><td bgcolor="#dd5f33" align="center" style="background-color:#dd5f33;border:2px solid #dd5f33;">
    <a href="{{ RootURL }}/admin" target="_blank" style="display:inline-block;padding:14px 26px;font-family:'Barlow Condensed','Arial Narrow',Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;line-height:1.1;letter-spacing:0.08em;text-transform:uppercase;color:#1c1714;text-decoration:none;">listmonk öffnen &nbsp;&rarr;</a>
  </td></tr>
</table>

{{ template "footer" }}
{{ end }}
