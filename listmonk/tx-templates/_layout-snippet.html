<!--
  Shared markup reference for the Männerkreis transactional templates.

  listmonk transactional templates are standalone (there is no shared file
  layout like the campaign "content" block), so every sibling *.html file
  repeats the same skeleton. When you create a template in listmonk, paste one
  of those files as the template BODY and set the template SUBJECT to:

      {{ .Tx.Data.subject }}

  Data is passed by the web app via POST /api/tx and read as
  {{ .Tx.Data.<field> }}. Multiline free text (description, locationDetails,
  content) is rendered inside a `white-space:pre-line` block so newlines show
  without needing raw HTML.

  ────────────────────────────────────────────────────────────────────────────
  THE DESIGN — the mail is the poster, not a product notification.

  It follows mens-circle.de: three colours, one condensed superfamily, square
  corners, structure carried by full-strength rules and whole bands of colour
  rather than by cards and shadows.

  Colour (light only — `color-scheme: light only` is pinned in every head, the
  site's dark mode has no equivalent in email):

      #e8e0d2  sand    the ground the sheet lies on
      #f2ede3  paper   the sheet itself
      #1c1714  ink     masthead band, footer band, headings
      #4a4139  ink-mid running text on paper          (8.5:1)
      #645a50  muted   markers, labels, meta          (5.8:1)
      #dd5f33  orange  the rule under the masthead, the button, the numerals
      #d8cfbe  hairline between rows
      #a39786  chalk-muted — the only muted text that works on the ink (6.2:1)

  The contrast rules from the site hold here too: orange is fill, stroke and
  LARGE text only (3.1:1 on paper), so the button carries an INK label — white
  on this orange is 3.6:1 and fails. Orange text is legible on the ink band, so
  the footer links may be orange.

  Type, two registers that never meet in the middle:

      poster   'Barlow Condensed','Arial Narrow',Arial,Helvetica,sans-serif
               800, uppercase, 44px (32px on mobile), line-height .94
      reading  'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif
               400/600, 16–17px, line-height 1.6–1.7
      marker   the condensed face again at 12px, 600, letter-spacing .14em,
               uppercase — the counterweight, and the only other uppercase

  Barlow is loaded from Google Fonts in the head. Apple Mail and iOS honour it;
  Gmail and Outlook fall back to Arial Narrow / Helvetica, which keeps the
  condensed/normal contrast intact. Nothing depends on the webfont arriving.

  Two notes on what is deliberately absent:

  * No ring. The one graphic motif of the site is an SVG cropped at a viewport
    edge — neither survives an email client. The 4px orange rule under the
    masthead is its stand-in: the same colour doing the same job of cutting the
    page in two.
  * No radius, no shadow, no card. A rounded white card on parchment was the
    old identity; the sheet now sits flat on the sand ground.

  Line height on the display: .94, not the site's .85. German umlauts overshoot
  the cap height, and an email client's line box cannot be reserved with the
  `padding-block-start` trick reliably — the looser leading buys that room.

  ────────────────────────────────────────────────────────────────────────────
  THE SKELETON

  <!doctype html>
  <html lang="de" …>            head: viewport, color-scheme light only,
                                 mso PixelsPerInch, Google Fonts link, and a
                                 <style> holding the client resets and the
                                 single max-width:620px media query
  <body style="…#e8e0d2">
    preheader div (hidden, carries {{ .Tx.Data.subject }})
    outer table                  ground #e8e0d2, padding 28px 12px
      sheet table (600px)        #f2ede3, class="em-sheet"
        ① masthead band          #1c1714 — brand 27px condensed + marker
        ② 4px orange rule
        ③ content td             class="em-pad", padding 34px 40px 30px
             marker + display headline + lede
             data block: 3px ink rule, then a #e8e0d2 panel of label/value rows
             CTA: orange cell, ink label, square, trailing →
             section heading: 2px ink rule, then 20px condensed uppercase
             list: hairline-separated rows, never a bulleted <ul>
             sign-off
        ④ footer band            #1c1714 — brand, footerDescription, links,
                                  and the "why you got this" line
  -->
